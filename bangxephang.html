<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Xếp Hạng GemPoint</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #eef2f6; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .lb-box { background: #ffffff; width: 100%; max-width: 550px; border-radius: 16px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1); overflow: hidden; border: 1px solid #cbd5e1; }
    .lb-header { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 50%, #f59e0b 100%); color: #0f172a; padding: 18px 20px; text-align: center; }
    .lb-header h2 { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .lb-header p { font-size: 0.85rem; color: #451a03; margin-top: 4px; font-weight: 500; }
    .lb-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-height: 450px; overflow-y: auto; }
    .lb-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; }
    .lb-item.me { background: #eff6ff; border: 1.5px solid #3b82f6; }
    .lb-item.top-1 { background: #fffbeb; border-color: #f59e0b; }
    .lb-item.top-2 { background: #f8fafc; border-color: #94a3b8; }
    .lb-item.top-3 { background: #fff7ed; border-color: #d97706; }
    .lb-left { display: flex; align-items: center; gap: 12px; }
    .rank-badge { width: 30px; height: 30px; border-radius: 50%; background: #e2e8f0; color: #334155; font-weight: 800; font-size: 0.9rem; display: flex; justify-content: center; align-items: center; }
    .top-1 .rank-badge { background: #f59e0b; color: #ffffff; }
    .top-2 .rank-badge { background: #64748b; color: #ffffff; }
    .top-3 .rank-badge { background: #b45309; color: #ffffff; }
    .student-name { font-weight: 600; color: #0f172a; font-size: 0.98rem; }
    .me-tag { font-size: 0.75rem; background: #3b82f6; color: white; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
    .lb-score { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.05rem; color: #d97706; background: #fef3c7; padding: 5px 12px; border-radius: 20px; }
    .lb-score img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    
    /* Khu vực 2 nút bấm ở đáy khung */
    .lb-footer { padding: 0 20px 20px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .back-btn { background: linear-gradient(135deg, #f59e0b 0%, #EEAD0E 100%); color: #ffffff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 0.95rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
    .quiz-btn { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 0.95rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
    .loading { text-align: center; color: #64748b; padding: 20px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="lb-box">
    <div class="lb-header">
      <h2>🏆 Bảng Xếp Hạng GemPoint</h2>
      <p>Cập nhật tự động theo thành tích học viên</p>
    </div>
    <div class="lb-list" id="leaderboardList">
      <div class="loading">Đang tải bảng xếp hạng...</div>
    </div>
    <div class="lb-footer">
      <a href="trangchu1.html" class="back-btn">← Quay về trang chủ</a>
      <a href="tichluygempoint.html" class="quiz-btn">Làm tiếp Quiz →</a>
    </div>
  </div>

  <script>
    // Link Database chuẩn xác của bạn (đã sửa lại đúng địa chỉ)
    const DB_URL = "https://" + "tich-luy-gempoint-default-rtdb" + ".asia-southeast1." + "firebasedatabase.app/students.json";

    const currentUsername = localStorage.getItem("currentUsername");

    async function loadLeaderboard() {
      const listEl = document.getElementById("leaderboardList");
      try {
        const res = await fetch(DB_URL);
        const data = await res.json();

        if (!data) {
          listEl.innerHTML = '<div class="loading">Chưa có học viên nào ghi điểm!</div>';
          return;
        }

        // Chuyển dữ liệu thành danh sách và sắp xếp điểm từ cao xuống thấp
        const students = Object.keys(data).map(username => ({
          username: username,
          name: data[username].name || username,
          gempoint: data[username].gempoint || 0
        }));
        students.sort((a, b) => b.gempoint - a.gempoint);

        listEl.innerHTML = "";
        students.forEach((st, index) => {
          const rank = index + 1;
          const isMe = (st.username === currentUsername);
          let topClass = rank === 1 ? "top-1" : (rank === 2 ? "top-2" : (rank === 3 ? "top-3" : ""));

          listEl.innerHTML += `
            <div class="lb-item ${topClass} ${isMe ? 'me' : ''}">
              <div class="lb-left">
                <div class="rank-badge">${rank}</div>
                <div class="student-name">
                  ${st.name}
                  ${isMe ? '<span class="me-tag">You</span>' : ''}
                </div>
              </div>
              <div class="lb-score">
                <span>${st.gempoint}</span>
                <img src="logogempoint.png" alt="Gem">
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error("Lỗi tải bảng xếp hạng:", err);
        listEl.innerHTML = '<div class="loading">Không thể tải dữ liệu bảng xếp hạng!</div>';
      }
    }

    window.onload = loadLeaderboard;
  </script>
</body>
</html>
