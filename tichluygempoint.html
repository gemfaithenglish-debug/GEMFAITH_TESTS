<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Săn điểm GemPoint</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #eef2f6; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .quiz-box { background: #ffffff; width: 100%; max-width: 550px; border-radius: 16px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1); overflow: hidden; border: 1px solid #cbd5e1; }
    .header { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 50%, #f59e0b 100%); color: black; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.15rem; }
    /* Khung chứa điểm và logo GemPoint nâng cấp VIP */
.gem-badge {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  padding: 6px 16px 6px 8px;
  border-radius: 30px;
  font-weight: 800;
  color: #fde68a;
  font-size: 0.9rem;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 2px solid #fef08a;
  box-shadow: 0 4px 15px rgba(15, 23, 42, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
}

/* Hiệu ứng vệt sáng lướt qua khung điểm */
.gem-badge::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
  transform: skewX(-25deg);
  animation: gemShine 3.5s infinite;
}

@keyframes gemShine {
  0%, 65% { left: -100%; }
  100% { left: 160%; }
}

.gem-logo-header {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: #ffffff;
  border: 1.5px solid #fbbf24;
  box-shadow: 0 0 8px rgba(251, 191, 36, 0.7);
}

.gem-logo-inline {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  object-fit: cover;
  vertical-align: middle;
  margin-left: 4px;
  margin-bottom: 2px;
}

.gem-badge span {
  color: #ffffff;
  font-size: 1.15rem;
  font-weight: 900;
  text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
  transition: color 0.2s ease;
}

/* Hiệu ứng nảy khung khi cộng hoặc trừ điểm */
.gem-badge.score-up {
  transform: scale(1.12);
  border-color: #34d399;
  box-shadow: 0 0 18px rgba(16, 185, 129, 0.65);
}
.gem-badge.score-up span { color: #34d399; }

.gem-badge.score-down {
  transform: scale(0.95);
  border-color: #f87171;
  box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
}
.gem-badge.score-down span { color: #f87171; }

    .bar { height: 4px; width: 0%; background: #3b82f6; }
    .body { padding: 24px 20px; }
    .q-num { font-size: 0.85rem; color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
    .q-text { font-size: 1.15rem; color: #0f172a; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
    .opt-list { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; text-align: left; font-size: 1rem; color: #0f172a; cursor: pointer; font-weight: 500; transition: 0.2s; }
    .opt-btn:hover:not(:disabled) { background: #eff6ff; border-color: #3b82f6; }
    .opt-btn.correct { background: #d1fae5; border-color: #10b981; color: #065f46; }
    .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .msg { margin-top: 16px; padding: 10px; border-radius: 8px; text-align: center; font-weight: 600; display: none; }
    .msg.ok { display: block; background: #ecfdf5; color: #047857; }
    .msg.no { display: block; background: #fef2f2; color: #b91c1c; }
	
       /* Khung nút quay về và bảng xếp hạng */
    .footer-back { padding: 0 20px 22px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .back-btn { background: linear-gradient(135deg, #f59e0b 0%, #EEAD0E 100%); color: #ffffff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.25); transition: all 0.2s ease; }
    .back-btn:hover { background: #d97706; transform: translateY(-1px); }
      /* Nút chuyển trang Bảng xếp hạng nền trắng tôn logo */
    .rank-btn {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      color: #0f172a;
      border: 1.5px solid #f59e0b;
      border-radius: 12px;
      padding: 7px 16px 7px 9px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.18), 0 1px 3px rgba(15, 23, 42, 0.08);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Khung tròn nền trắng giữ trọn chi tiết logo */
    .rank-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: contain;
      background: #ffffff;
      padding: 2px;
      border: 1px solid #fde68a;
      flex-shrink: 0;
    }

    /* Hiệu ứng vệt sáng lướt qua nút */
    .rank-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.25), transparent);
      transform: skewX(-25deg);
      transition: left 0.55s ease;
    }

    .rank-btn:hover {
      background: #fffbeb;
      color: #b45309;
      border-color: #d97706;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.28);
    }

    .rank-btn:hover::after {
      left: 140%;
    }

    .rank-btn:active {
      transform: translateY(0) scale(0.98);
    }


    @media (max-width: 480px) {
      .header { padding: 14px 16px; }
      .header h1 { font-size: 1.05rem; }
      .gem-badge { font-size: 0.85rem; padding: 4px 10px 4px 6px; gap: 6px; }
      .gem-logo-header { width: 22px; height: 22px; }
      .body { padding: 20px 16px; }
      .q-text { font-size: 1.05rem; }
      .opt-btn { font-size: 0.95rem; padding: 12px 14px; }
      .footer-back { padding: 0 16px 18px 16px; }
      .back-btn { font-size: 0.9rem; padding: 9px 15px; }
    }
	
	/* Nhóm chứa nút ? và khung điểm ở góc phải tiêu đề */
.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Nút tròn dấu ? nhỏ gọn */
.help-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  color: #b45309;
  border: 1.5px solid #f59e0b;
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.help-btn:hover {
  background: #ffffff;
  transform: scale(1.08);
}

/* Lớp phủ mờ phía sau khi mở ảnh */
.voucher-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 9999;
}
.voucher-modal.show {
  display: flex;
  animation: fadeIn 0.2s ease;
}

/* Khung chứa ảnh vừa vặn điện thoại */
.voucher-content {
  position: relative;
  background: #ffffff;
  padding: 8px;
  border-radius: 16px;
  max-width: 360px; /* Vừa đẹp màn hình điện thoại */
  width: 92%;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
  border: 2px solid #fcd34d;
}
.voucher-content img {
  width: 100%;
  height: auto;
  max-height: 75vh; /* Không bao giờ tràn quá chiều cao màn hình */
  object-fit: contain;
  border-radius: 10px;
  display: block;
}

/* Nút X đóng bảng voucher */
.close-voucher {
  position: absolute;
  top: -12px;
  right: -12px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ef4444;
  color: #ffffff;
  border: 2px solid #ffffff;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
}
.close-voucher:hover {
  background: #dc2626;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}


  </style>
</head>
<body>

   <div class="quiz-box">
    <div class="header">
      <h1>GEMQUIZ</h1>
      <div class="header-right">
        <button class="help-btn" onclick="openVoucher()" title="Bảng đổi quà GemPoint">?</button>
        <div class="gem-badge">
          <img src="logogempoint.png" alt="GemPoint" class="gem-logo-header">
          GEMPOINT: <span id="score">0</span>
        </div>
      </div>
    </div>

    <div class="bar" id="bar"></div>
    <div class="body">
      <div class="q-num" id="qNum">CÂU 1</div>
      <div class="q-text" id="qText">What is the synonym of the word 'Happy'?</div>
      <div class="opt-list" id="optList"></div>
      <div class="msg" id="msg"></div>
    </div>
      
    <div class="footer-back">
      <a href="tichluyhome.html" class="back-btn">← Quay về trang trước</a>
      <a href="bangxephang.html" class="rank-btn">
        <img src="logobxh.png" alt="BXH" class="rank-logo">
        Bảng xếp hạng
      </a>
    </div>
  </div>
  
  <!-- Khung hiển thị ảnh bảng voucher -->
  <div class="voucher-modal" id="voucherModal" onclick="closeVoucher(event)">
    <div class="voucher-content">
      <button class="close-voucher" onclick="closeVoucherBtn()"><b>✕</b></button>
      <img src="bangvouchergempoint.jpg" alt="Bảng Voucher GemPoint">
    </div>
  </div>

    <script src="questions.js"></script>

  <script>
    const DB_URL = "https://" + "tich-luy-gempoint-default-rtdb" + ".asia-southeast1." + "firebasedatabase.app/students";

    const currentUsername = localStorage.getItem("currentUsername") || "hocvien_test";
    const currentStudentName = localStorage.getItem("currentStudentName") || "Học viên Test";


    var idx = 0;
    var count = 1;
    var gem = 0;
    var lock = false;

    // 1. Tải điểm từ Database lên
    async function loadScoreFromDB() {
      try {
        const res = await fetch(`${DB_URL}/${currentUsername}.json`);
        const data = await res.json();
        if (data && typeof data.gempoint === "number") {
          gem = data.gempoint;
        } else {
          await saveScoreToDB(0);
        }
        document.getElementById("score").innerText = gem;
      } catch (err) {
        console.error("Lỗi tải điểm:", err);
      }
    }

    // 2. Lưu điểm mới lên Database
    async function saveScoreToDB(newGem) {
      try {
        await fetch(`${DB_URL}/${currentUsername}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: currentStudentName,
            gempoint: newGem,
            lastUpdated: new Date().toLocaleString("vi-VN")
          })
        });
      } catch (err) {
        console.error("Lỗi lưu điểm:", err);
      }
    }

    function showQ() {
      lock = false;
      var bar = document.getElementById("bar");
      bar.style.transition = "none";
      bar.style.width = "0%";
      var msg = document.getElementById("msg");
      msg.className = "msg";
      msg.innerHTML = "";
      var item = questions[idx];
      document.getElementById("qNum").innerText = "CÂU " + count;
      document.getElementById("qText").innerText = item.q;
      var list = document.getElementById("optList");
      list.innerHTML = "";
      for (var i = 0; i < item.a.length; i++) {
        var btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = item.a[i];
        btn.setAttribute("data-index", i);
        btn.onclick = function() {
          checkAns(parseInt(this.getAttribute("data-index")), this);
        };
        list.appendChild(btn);
      }
    }

    async function checkAns(choice, btn) {
      if (lock) return;
      lock = true;
      var item = questions[idx];
      var btns = document.querySelectorAll(".opt-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].disabled = true;
      }
      var msg = document.getElementById("msg");
      var logoHtml = '<img src="logogempoint.png" alt="Gem" class="gem-logo-inline">';
      
            // Lấy mức điểm riêng của câu hỏi (nếu câu nào quên ghi thì tự lấy mặc định +1 và -0.5)
      var winPoint = (item.plus !== undefined) ? item.plus : 1;
      var losePoint = (item.minus !== undefined) ? item.minus : 0.5;

      if (choice === item.c) {
        gem = Math.round((gem + winPoint) * 100) / 100; // Làm tròn tránh lỗi số thập phân lẻ
        btn.classList.add("correct");
        msg.className = "msg ok";
        msg.innerHTML = "Chính xác! +" + winPoint + " GemPoint " + logoHtml;
      } else {
        gem = Math.round((gem - losePoint) * 100) / 100;
        btn.classList.add("wrong");
        btns[item.c].classList.add("correct");
        msg.className = "msg no";
        msg.innerHTML = "Sai rồi! -" + losePoint + " GemPoint " + logoHtml;
      }

      
      document.getElementById("score").innerText = gem;
      await saveScoreToDB(gem);

      var bar = document.getElementById("bar");
      bar.offsetHeight;
      bar.style.transition = "width 1.2s linear";
      bar.style.width = "100%";
      setTimeout(function() {
        count++;
        idx = (idx + 1) % questions.length;
        showQ();
      }, 1200);
    }

        // Hàm xáo trộn ngẫu nhiên danh sách câu hỏi
    function shuffleQuestions(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    window.onload = async function() {
      shuffleQuestions(questions); // Xáo trộn câu hỏi ngay khi vừa vào trang
      showQ();
      await loadScoreFromDB();
    };

  
      // Mở bảng voucher
    function openVoucher() {
      document.getElementById("voucherModal").classList.add("show");
    }

    // Đóng khi bấm nút X
    function closeVoucherBtn() {
      document.getElementById("voucherModal").classList.remove("show");
    }

    // Đóng khi bấm ra vùng mờ bên ngoài ảnh
    function closeVoucher(event) {
      if (event.target.id === "voucherModal") {
        document.getElementById("voucherModal").classList.remove("show");
      }
    }

  
  </script>
</body>
</html>
