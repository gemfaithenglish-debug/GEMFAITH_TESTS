    .help-btn:hover { background: #ffffff; transform: scale(1.08); }

    .gem-badge { position: relative; overflow: hidden; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 6px 16px 6px 8px; border-radius: 30px; font-weight: 800; color: #fde68a; font-size: 0.9rem; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; border: 2px solid #fef08a; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2); transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease; }

    .gem-logo-header { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; display: block; background: #ffffff; border: 1.5px solid #fbbf24; box-shadow: 0 0 8px rgba(251, 191, 36, 0.7); }
    .gem-logo-inline { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-left: 4px; margin-bottom: 2px; }
    .gem-badge span { color: #ffffff; font-size: 1.15rem; font-weight: 900; text-shadow: 0 0 10px rgba(251, 191, 36, 0.8); }

    .bar { height: 4px; width: 0%; background: #3b82f6; }
    .body { padding: 24px 20px; }
    
    .q-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .q-num { font-size: 0.85rem; color: #f59e0b; font-weight: bold; }
    .q-point-tag { font-size: 0.78rem; background: #fef3c7; color: #b45309; padding: 3px 9px; border-radius: 12px; font-weight: 700; border: 1px solid #fde68a; }
    
    .q-text { font-size: 1.1rem; color: #0f172a; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .q-hint { font-size: 0.88rem; color: #64748b; margin-bottom: 16px; font-style: italic; }

    .answer-zone {
      min-height: 76px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;

      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;

    .word-bank {

      user-select: none;

    .word-chip:hover:not(:disabled) {

    }

    }
    .word-chip.used {

      pointer-events: none;
      background: #e2e8f0;
    }

    .action-row { display: flex; gap: 10px; }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, startTime, duration, vol = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(vol, startTime);
      gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function soundSelect() {
      playTone(520, 'sine', audioCtx.currentTime, 0.07, 0.15);
    }

      const now = audioCtx.currentTime;
      playTone(587.33, 'triangle', now, 0.15, 0.25);

    }

    var idx = 0;
    var count = 1;
    var gem = 0;
    var lock = false;
    var bankWords = [];
    var selectedIndices = [];

    async function loadScoreFromDB() {
      try {
        const res = await fetch(`${DB_URL}/${currentUsername}.json`);
        const data = await res.json();
        if (data && typeof data.gempoint === "number") {
          gem = data.gempoint;
        } else {
          await saveScoreToDB(0);
        }
        document.getElementById("score").innerText = gem;
      } catch (err) {
        console.error("Lỗi tải điểm:", err);
      }
    }

    async function saveScoreToDB(newGem) {
      try {
        await fetch(`${DB_URL}/${currentUsername}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: currentStudentName,
            gempoint: newGem,
            lastUpdated: new Date().toLocaleString("vi-VN")
          })
        });
      } catch (err) {
        console.error("Lỗi lưu điểm:", err);
      }
    }

    function shuffleArray(arr) {
      let copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function showSentence() {
      lock = false;
      selectedIndices = [];

      var bar = document.getElementById("bar");
      bar.style.transition = "none";
      bar.style.width = "0%";

      var msg = document.getElementById("msg");
      msg.className = "msg";
      msg.innerHTML = "";

      var ansZone = document.getElementById("answerZone");
      ansZone.className = "answer-zone";

      document.getElementById("clearBtn").disabled = false;
      document.getElementById("checkBtn").disabled = false;

      var item = sentences[idx];
      document.getElementById("qNum").innerText = "CÂU " + count;
      document.getElementById("qPointTag").innerText = "Trị Giá: " + item.plus + "GP" + " , Sai Trừ: " + item.minus + "GP";
      document.getElementById("qHint").innerText = "Gợi ý: " + item.hint;

      var originalWords = item.sentence.split(" ");
      do {
        bankWords = shuffleArray(originalWords);
      } while (bankWords.join(" ") === item.sentence && originalWords.length > 1);

      renderWords();
    }

    function renderWords() {
      var ansZone = document.getElementById("answerZone");
      var bankZone = document.getElementById("wordBank");

      ansZone.innerHTML = "";
      if (selectedIndices.length === 0) {
        ansZone.innerHTML = '<span class="zone-placeholder">Bấm vào các từ bên dưới để ghép câu...</span>';
      } else {
        selectedIndices.forEach((wordIdx, posInAns) => {
          var btn = document.createElement("button");
          btn.className = "word-chip in-answer";
          btn.innerText = bankWords[wordIdx];
          btn.disabled = lock;
          btn.onclick = function() {
            if (lock) return;
			soundSelect(); 
            selectedIndices.splice(posInAns, 1);
            renderWords();
          };
          ansZone.appendChild(btn);
        });
      }

      bankZone.innerHTML = "";
      bankWords.forEach((word, wordIdx) => {
        var btn = document.createElement("button");
        btn.className = "word-chip";
        btn.innerText = word;
        if (selectedIndices.includes(wordIdx)) {
          btn.classList.add("used");
        }
        btn.disabled = lock || selectedIndices.includes(wordIdx);
        btn.onclick = function() {
          if (lock) return;
		  soundSelect();
          selectedIndices.push(wordIdx);
          renderWords();
        };
        bankZone.appendChild(btn);
      });
    }

    function resetCurrentSentence() {
      if (lock) return;
      selectedIndices = [];
      renderWords();
    }

    async function checkSentence() {
      if (lock) return;
      if (selectedIndices.length === 0) {
        alert("Bạn hãy chọn các từ để ghép thành câu trước khi kiểm tra nhé!");
        return;
      }

      lock = true;
      document.getElementById("clearBtn").disabled = true;
      document.getElementById("checkBtn").disabled = true;
      renderWords();

      var item = sentences[idx];
      var userSentence = selectedIndices.map(i => bankWords[i]).join(" ");
      var ansZone = document.getElementById("answerZone");
      var msg = document.getElementById("msg");
      var logoHtml = '<img src="logogempoint.png" alt="Gem" class="gem-logo-inline">';

      var isCorrect = (userSentence === item.sentence);

      if (isCorrect) {
	    soundCorrect();
        gem = Math.round((gem + item.plus) * 100) / 100;
        ansZone.classList.add("correct-zone");
        msg.className = "msg ok";
        msg.innerHTML = "Chính xác! +" + item.plus + " GemPoint " + logoHtml;
      } else {
	  soundWrong(); 
        gem = Math.round((gem - item.minus) * 100) / 100;
        ansZone.classList.add("wrong-zone");
        msg.className = "msg no";
        msg.innerHTML = "Chưa đúng! -" + item.minus + " GemPoint " + logoHtml + "<br><span style='font-size:0.88rem; color:#0f172a;'>Đáp án đúng: <b>" + item.sentence + "</b></span>";
      }

      document.getElementById("score").innerText = gem;
      var badge = document.querySelector(".gem-badge");
      badge.classList.remove("score-up", "score-down");
      void badge.offsetWidth;
      badge.classList.add(isCorrect ? "score-up" : "score-down");
      setTimeout(() => badge.classList.remove("score-up", "score-down"), 600);

      await saveScoreToDB(gem);

      var delayTime = isCorrect ? 1400 : 2600;
      var bar = document.getElementById("bar");
      bar.offsetHeight;
      bar.style.transition = "width " + (delayTime / 1000) + "s linear";
      bar.style.width = "100%";

      setTimeout(function() {
        count++;
        idx = (idx + 1) % sentences.length;
        showSentence();
      }, delayTime);
    }

    function openVoucher() { document.getElementById("voucherModal").classList.add("show"); }
    function closeVoucherBtn() { document.getElementById("voucherModal").classList.remove("show"); }
    function closeVoucher(event) {
      if (event.target.id === "voucherModal") {
        document.getElementById("voucherModal").classList.remove("show");
      }
    }

    window.onload = async function() {
      sentences = shuffleArray(sentences);
      showSentence();
      await loadScoreFromDB();
    };
  </script>
</body>
</html>
